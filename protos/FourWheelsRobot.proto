#VRML_SIM R2025a utf8
# Robô de 4 rodas com sensores de distância

PROTO FourWheelsRobot [
  field SFVec3f    translation  0 0 0
  field SFRotation rotation     0 0 1 0
  field SFFloat    bodyMass     1
  field SFString   name         "robot_proto"
  field SFString   controller   "four_wheeled_collision_avoidance"
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    children [
      DEF BODY Shape {
        appearance PBRAppearance {
          baseColor 1 0 0
          roughness 1
          metalness 0
        }
        geometry Box {
          size 0.2 0.1 0.05
        }
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor 0.05 0.06 0
        }
        device [
          RotationalMotor {
            name "wheel1"
          }
        ]
        endPoint DEF WHEEL1 Solid {
          translation 0.05 0.06 0
          rotation 1 0 0 1.5708
          children [
            DEF WHEEL Shape {
              appearance PBRAppearance {
                baseColor 0 1 0
                roughness 1
                metalness 0
              }
              geometry Cylinder {
                height 0.02
                radius 0.04
              }
            }
          ]
          boundingObject USE WHEEL
          physics DEF WHEEL_PH Physics {
          }
        }
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor 0.05 -0.06 0
        }
        device [
          RotationalMotor {
            name "wheel2"
          }
        ]
        endPoint Solid {
          translation 0.05 -0.06 0
          rotation 1 0 0 1.5708
          children [
            USE WHEEL
          ]
          name "solid(1)"
          boundingObject USE WHEEL
          physics USE WHEEL_PH
        }
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor -0.05 0.06 0
        }
        device [
          RotationalMotor {
            name "wheel3"
          }
        ]
        endPoint Solid {
          translation -0.05 0.06 0
          rotation 1 0 0 1.5708
          children [
            USE WHEEL
          ]
          name "solid(2)"
          boundingObject USE WHEEL
          physics USE WHEEL_PH
        }
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor -0.05 -0.06 0
        }
        device [
          RotationalMotor {
            name "wheel4"
          }
        ]
        endPoint Solid {
          translation -0.05 -0.06 0
          rotation 1 0 0 1.5708
          children [
            USE WHEEL
          ]
          name "solid(3)"
          boundingObject USE WHEEL
          physics USE WHEEL_PH
        }
      }
      DistanceSensor {
        translation 0.1 -0.03 0
        rotation 0 0 1 -0.3
        children [
          DEF DS_SHAPE Shape {
            appearance PBRAppearance {
              baseColor 0 0 1
              roughness 1
              metalness 0
            }
            geometry Box {
              size 0.01 0.01 0.01
            }
          }
        ]
        name "ds_right"
        lookupTable [
          0 0 0
          0.1 1000 0
        ]
        boundingObject USE DS_SHAPE
      }
      DistanceSensor {
        translation 0.1 0.03 0
        rotation 0 0 1 0.3
        children [
          USE DS_SHAPE
        ]
        name "ds_left"
        lookupTable [
          0 0 0
          0.1 1000 0
        ]
        boundingObject USE DS_SHAPE
      }
    ]
    boundingObject USE BODY
    physics Physics {
      density -1
      mass IS bodyMass
    }
    controller IS controller
  }
}